<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#dfe3ec">
<!--CSP-->
<title>Little Log</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="titlerow"><span id="av" hidden></span><h1 id="title">Little Log</h1></div>
  <nav id="kidBar" class="kidbar" aria-label="Children" hidden></nav>
  <div id="syncLine" class="note" aria-live="polite"></div>
  <div id="sleepBanner" class="banner" hidden></div>
</header>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="day" class="on"><span>📅</span>Day</button>
  <button data-tab="month"><span>🗓️</span>Month</button>
  <button data-tab="stats"><span>📊</span>Stats</button>
  <button data-tab="guide"><span>📖</span>Guide</button>
  <button data-tab="family"><span>👨‍👩‍👧</span>Family<i id="famBadge" class="badge" hidden></i></button>
  <button data-tab="more"><span>⚙️</span>More</button>
</nav>

<div id="sheetBack" class="sheet-back" hidden></div>
<section id="sheet" class="sheet" hidden></section>
<div id="toast" class="toast" hidden></div>
<div id="cover" class="cover" hidden aria-hidden="true"><span>🍼</span></div>

<script src="native-plugins.js"></script>
<script src="config.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsqr.js"></script>
<script src="kids.js"></script>
<script src="icons.js"></script>
<script src="guide.js"></script>
<script src="art.js"></script>
<script src="store.js"></script>
<script src="native.js"></script>
<script src="auth.js"></script>
<script src="e2ee.js"></script>
<script src="sync.js"></script>
<script src="cloud.js"></script>
<script src="lock.js"></script>
<script src="account.js"></script>
<script src="app.js"></script>
</body>
</html>
