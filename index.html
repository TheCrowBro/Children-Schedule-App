<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b7cfa">
<title>Little Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1 id="title">Little Log</h1>
  <div id="sleepBanner" class="banner" hidden></div>
</header>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="day" class="on"><span>📅</span>Day</button>
  <button data-tab="month"><span>🗓️</span>Month</button>
  <button data-tab="stats"><span>📊</span>Stats</button>
  <button data-tab="more"><span>⚙️</span>More</button>
</nav>

<div id="sheetBack" class="sheet-back" hidden></div>
<section id="sheet" class="sheet" hidden></section>
<div id="toast" class="toast" hidden></div>

<script src="app.js"></script>
</body>
</html>
